<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #c { position: absolute; left: 0; top: 0; width: 96px; height: 96px; cursor: grab; transition: filter 0.15s; }
  #c.held { cursor: grabbing; }
  #c.listen { filter: drop-shadow(0 0 5px #4da3ff) drop-shadow(0 0 3px #4da3ff); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="renderer.js"></script>
</body>
</html>
